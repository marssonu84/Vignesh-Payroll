<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Site Under Maintenance | Vighnesh Payroll Systems</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Arial, Helvetica, sans-serif; background: #f6f8fb; color: #202938; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { width: min(620px, 100%); background: #fff; border-radius: 18px; padding: 42px 30px; text-align: center; box-shadow: 0 12px 40px rgba(20, 35, 60, .10); }
    .icon { width: 74px; height: 74px; margin: 0 auto 22px; border-radius: 50%; display: grid; place-items: center; background: #fff4df; font-size: 36px; }
    h1 { margin: 0 0 14px; font-size: clamp(28px, 5vw, 40px); line-height: 1.15; color: #172033; }
    p { margin: 0 auto; max-width: 500px; font-size: 17px; line-height: 1.65; color: #5b6576; }
    .small { margin-top: 20px; font-size: 14px; color: #8992a3; }
    .btn { display: inline-block; margin-top: 26px; padding: 12px 22px; border-radius: 10px; text-decoration: none; background: #172033; color: #fff; font-weight: 700; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="icon" aria-hidden="true">⚙️</div>
    <h1>Site Under Maintenance</h1>
    <p>We are temporarily unable to process your request. Our team has been notified. Please try again after a few minutes.</p>
    <a class="btn" href="/">Try Again</a>
    <div class="small">Thank you for your patience.</div>
  </main>
</body>
</html>
